<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Compound</title>
<style>
  @font-face { font-family: "L"; src: url("fonts/label.ttf"); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050608; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
// An illustrative 3D model of the Abbottabad compound (not to survey accuracy): a walled, roughly
// triangular plot with a three-storey house, recorded frame by frame for the film.
// 0-3.6 s: night orbit round the walls.  3.6-9.5 s: the camera rises, a line runs about 1 km to
// a block standing for the Pakistan Military Academy, and the distance types on.
import * as THREE from 'three';
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const S = new THREE.Scene(); S.background = new THREE.Color(0x06080c); S.fog = new THREE.Fog(0x06080c, 400, 5000);
const cam = new THREE.PerspectiveCamera(34, 16 / 9, 0.5, 4000);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const ramp = (t, t0, d) => clamp((t - t0) / d);

// ground with a faint grid
const gc = document.createElement('canvas'); gc.width = gc.height = 1024; const g = gc.getContext('2d');
g.fillStyle = '#1b1e22'; g.fillRect(0, 0, 1024, 1024);
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.035})`; g.fillRect(rnd() * 1024, rnd() * 1024, 2 + rnd() * 6, 2 + rnd() * 6); }
g.strokeStyle = 'rgba(200,50,40,0.22)'; g.lineWidth = 2;
for (let i = 0; i <= 1024; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 1024); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(1024, i); g.stroke(); }
const gt = new THREE.CanvasTexture(gc); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(40, 40); gt.colorSpace = THREE.SRGBColorSpace;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ map: gt, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; S.add(ground);

const wallM = new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.95 });
const houseM = new THREE.MeshStandardMaterial({ color: 0xa79f91, roughness: 0.9 });
const darkM = new THREE.MeshStandardMaterial({ color: 0x2a2826, roughness: 1 });
function box(w, h, d, m, x, y, z, ry = 0) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.rotation.y = ry; b.castShadow = b.receiveShadow = true; S.add(b); return b; }
// walled plot: an irregular triangle-ish outline, walls 4-5.5 m
const pts = [[-38, -22], [36, -26], [30, 8], [6, 30], [-30, 18]];
for (let i = 0; i < pts.length; i++) {
  const [x0, z0] = pts[i], [x1, z1] = pts[(i + 1) % pts.length];
  const L = Math.hypot(x1 - x0, z1 - z0), h = i === 0 ? 5.5 : 4.2;
  box(L, h, 0.5, wallM, (x0 + x1) / 2, h / 2, (z0 + z1) / 2, -Math.atan2(z1 - z0, x1 - x0));
}
box(30, 4.2, 0.5, wallM, 0, 2.1, -4, 0.08);                     // inner dividing wall
// the main house: three storeys, a top-floor terrace with a privacy wall
box(18, 3.2, 12, houseM, -6, 1.6, 10); box(18, 3.2, 12, houseM, -6, 4.8, 10); box(12, 3.0, 9, houseM, -8, 7.9, 10.5);
box(13, 2.1, 0.3, wallM, -8, 10.4, 15.2);
for (let f = 0; f < 3; f++) for (let k = 0; k < 4; k++) box(1.2, 1.1, 0.2, darkM, -13 + k * 4.4, 1.9 + f * 3.1, 3.9);
box(10, 3, 8, houseM, 22, 1.5, -14);                            // guest house
box(5, 3, 5, darkM, -28, 1.5, -15);                             // shed

// moonlight + a cold fill + one warm window light
S.add(new THREE.HemisphereLight(0x8899bb, 0x111111, 0.55));
const moon = new THREE.DirectionalLight(0xbcd0ff, 1.6); moon.position.set(-80, 140, 60); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048); Object.assign(moon.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 400 }); S.add(moon);
const lamp = new THREE.PointLight(0xffb060, 60, 30, 2); lamp.position.set(-8, 8, 2); S.add(lamp);

// the academy block, about 1 km away (to the north-east here), and the line to it
const AC = new THREE.Vector3(700, 0, -720);
const acM = new THREE.MeshStandardMaterial({ color: 0x7d8794, roughness: 0.8, emissive: 0x1c2027 });
box(160, 14, 90, acM, AC.x, 7, AC.z, 0.3);
const acL = new THREE.PointLight(0xffd9a0, 9000, 400, 2); acL.position.set(AC.x, 90, AC.z); S.add(acL);
box(60, 22, 40, acM, AC.x - 40, 11, AC.z + 10, 0.3);
const LEN = Math.hypot(AC.x, AC.z);
const lineG = new THREE.BoxGeometry(LEN, 1, 9); lineG.translate(LEN / 2, 0, 0);
const line = new THREE.Mesh(lineG, new THREE.MeshBasicMaterial({ color: 0xe8392e })); line.position.y = 1.2;
line.rotation.y = -Math.atan2(AC.z, AC.x); S.add(line);
const ringM = new THREE.MeshBasicMaterial({ color: 0xe0362c, side: THREE.DoubleSide, transparent: true });
const ring = new THREE.Mesh(new THREE.RingGeometry(62, 70, 64), ringM); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.6; S.add(ring);
const ring2 = ring.clone(); ring2.material = ringM.clone(); ring2.scale.setScalar(2.4); ring2.position.set(AC.x, 0.6, AC.z); S.add(ring2);

await document.fonts.load('80px L', 'अ');
function label(text, sub) {
  const c = document.createElement('canvas'), x = c.getContext('2d'); c.width = 1400; c.height = 300;
  x.font = '600 110px L'; const w1 = x.measureText(text).width; x.font = '400 56px L'; const w2 = sub ? x.measureText(sub).width : 0;
  const w = Math.max(w1, w2) + 80; c.width = w; x.fillStyle = 'rgba(10,10,12,0.78)'; x.fillRect(0, 0, w, 300);
  x.fillStyle = '#e0362c'; x.fillRect(0, 0, 10, 300);
  x.fillStyle = '#f6f1e8'; x.font = '600 110px L'; x.textBaseline = 'middle'; x.fillText(text, 40, sub ? 110 : 150);
  if (sub) { x.fillStyle = '#c9c0b4'; x.font = '400 56px L'; x.fillText(sub, 40, 225); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false })); s.userData.a = w / 300; s.renderOrder = 50; S.add(s); return s;
}
const labDist = label('≈ 1 किमी'), labAc = label('मिलिट्री अकादमी', 'काकुल'), labNote = label('प्रतीकात्मक 3D मॉडल'), labHide = label('बिन लादेन का ठिकाना');
labHide.position.set(0, 80, 0);
labDist.position.set(AC.x / 2, 60, AC.z / 2); labAc.position.set(AC.x, 110, AC.z);

let T = 0; window.__recordFrame = t => { T = t; };
const t0 = performance.now(); let recording = false;
window.__recordFrame = t => { recording = true; T = t; };
function draw(t) {
  // camera: orbit low round the compound, then rise and pull back to show the line to the academy
  const orbit = -0.9 + t * 0.22;
  const near = new THREE.Vector3(Math.cos(orbit) * 95, 34 + t * 2, Math.sin(orbit) * 95);
  const far = new THREE.Vector3(-380, 1050, 820);
  const k = ease(ramp(t, 3.6, 3.2));
  cam.position.copy(near).lerp(far, k);
  const look = new THREE.Vector3(0, 4, 0).lerp(new THREE.Vector3(AC.x * 0.42, 0, AC.z * 0.42), k);
  cam.lookAt(look);
  const lu = ease(ramp(t, 4.4, 2.0));
  line.visible = lu > 0; line.scale.set(Math.max(lu, 0.0001), 1, 1);
  ring.material.opacity = 0.35 + 0.65 * ramp(t, 3.8, 0.4); ring.visible = k > 0.02;
  ring2.material.opacity = ramp(t, 6.0, 0.4); ring2.visible = t > 6.0;
  const d = cam.position.distanceTo(labDist.position);
  for (const [s, tin, sc] of [[labDist, 6.4, 0.055], [labAc, 6.0, 0.055], [labHide, 4.6, 0.05], [labNote, 0.3, 0.03]]) {
    s.material.opacity = ramp(t, tin, 0.4); s.visible = t > tin;
    const dd = cam.position.distanceTo(s.position); s.scale.set(dd * sc * s.userData.a, dd * sc, 1);
  }
  // the note sits low in the frame during the orbit
  labNote.position.copy(cam.position).add(new THREE.Vector3(0, -1, 0).applyQuaternion(cam.quaternion).multiplyScalar(0)).add(cam.getWorldDirection(new THREE.Vector3()).multiplyScalar(30)).add(new THREE.Vector3(0, -7.2, 0).applyQuaternion(cam.quaternion));
  labNote.material.opacity = ramp(t, 0.3, 0.4) * (1 - ramp(t, 3.4, 0.4));
  lamp.intensity = 60 + 8 * Math.sin(t * 3);
  R.render(S, cam);
}
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function loop() { if (!recording) T = ((performance.now() - t0) / 1000) % 10; draw(T); requestAnimationFrame(loop); }
draw(0); window.__ready = true; requestAnimationFrame(loop);
</script>
</body>
</html>
