<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Valley</title>
<style>
  @font-face { font-family: "L"; src: url("fonts/label.ttf"); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
// An illustrative 3D valley standing for Baisaran near Pahalgam: a meadow ringed by pine forest
// under snow peaks, seen in a slow, cold flyover. Not terrain data; labelled as illustrative.
import * as THREE from 'three';
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.9;
const S = new THREE.Scene(); S.background = new THREE.Color(0x8d98a6); S.fog = new THREE.Fog(0x8d98a6, 1400, 7000);
const cam = new THREE.PerspectiveCamera(38, 16 / 9, 1, 6000);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// value noise
const G = 64, grid = []; for (let i = 0; i < G * G; i++) grid.push(rnd());
const smooth = t => t * t * (3 - 2 * t);
function noise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = smooth(x - xi), yf = smooth(y - yi);
  const g = (a, b) => grid[((a % G + G) % G) + ((b % G + G) % G) * G];
  return (g(xi, yi) * (1 - xf) + g(xi + 1, yi) * xf) * (1 - yf) + (g(xi, yi + 1) * (1 - xf) + g(xi + 1, yi + 1) * xf) * yf; }
const fbm = (x, y) => { let v = 0, a = 0.5, f = 1; for (let o = 0; o < 5; o++) { v += a * noise(x * f, y * f); a *= 0.5; f *= 2; } return v; };
function height(x, z) { const r = Math.hypot(x, z * 1.3); const bowl = Math.max(0, r - 380) / 900;     // flat meadow in the middle
  return Math.pow(bowl, 1.6) * 900 * (0.55 + fbm(x / 420 + 7, z / 420 + 3)) + fbm(x / 120, z / 120) * 18; }
const geo = new THREE.PlaneGeometry(5000, 5000, 220, 220); geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
const grass = new THREE.Color(0x6f7d4a), rock = new THREE.Color(0x5d5a56), snow = new THREE.Color(0xf2f4f6), c = new THREE.Color();
for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), z = pos.getZ(i), h = height(x, z); pos.setY(i, h);
  c.copy(grass).lerp(rock, Math.min(1, Math.max(0, (h - 60) / 260))); if (h > 520) c.lerp(snow, Math.min(1, (h - 520) / 160));
  col.set([c.r, c.g, c.b], i * 3); }
geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
S.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: false })));
// pines on the lower slopes, instanced
const tree = new THREE.ConeGeometry(9, 42, 7); tree.translate(0, 21, 0);
const N = 3200, inst = new THREE.InstancedMesh(tree, new THREE.MeshStandardMaterial({ color: 0x23361f, roughness: 1 }), N);
const m = new THREE.Matrix4(); let k = 0;
for (let i = 0; i < 20000 && k < N; i++) { const x = (rnd() - 0.5) * 3600, z = (rnd() - 0.5) * 3600, h = height(x, z), r = Math.hypot(x, z * 1.3);
  if (r < 430 || h > 360) continue; const s = 0.7 + rnd() * 0.8; m.compose(new THREE.Vector3(x, h - 2, z), new THREE.Quaternion(), new THREE.Vector3(s, s * (0.9 + rnd() * 0.5), s)); inst.setMatrixAt(k++, m); }
inst.count = k; S.add(inst);
S.add(new THREE.HemisphereLight(0xdfe8f2, 0x3a3226, 1.2));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(-600, 900, 400); S.add(sun);
await document.fonts.load('80px L', 'अ');
function label(text, sub) { const cv = document.createElement('canvas'), x = cv.getContext('2d'); x.font = '600 96px L';
  const w = Math.max(x.measureText(text).width, 600) + 90; cv.width = w; cv.height = sub ? 250 : 170; x.fillStyle = 'rgba(10,10,12,0.78)'; x.fillRect(0, 0, w, cv.height);
  x.fillStyle = '#d8322a'; x.fillRect(0, 0, 12, cv.height); x.fillStyle = '#f6f1e8'; x.font = '600 96px L'; x.textBaseline = 'middle'; x.fillText(text, 44, 85);
  if (sub) { x.fillStyle = '#c9c0b4'; x.font = '400 48px L'; x.fillText(sub, 44, 195); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return { tex: t, a: w / cv.height }; }
const L1 = label('बैसरन घाटी, पहलगाम', 'प्रतीकात्मक 3D मॉडल');
const hud = new THREE.Sprite(new THREE.SpriteMaterial({ map: L1.tex, transparent: true, depthTest: false })); hud.renderOrder = 9; S.add(hud);
let T = 0, rec = false; window.__recordFrame = t => { rec = true; T = t; };
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function draw(t) {
  const u = ease(Math.min(1, t / 9));
  cam.position.set(-560 + 300 * u, 640 - 260 * u, 560 - 300 * u);
  cam.lookAt(new THREE.Vector3(500 + 200 * u, 260 - 120 * u, -500 - 200 * u));
  const dir = cam.getWorldDirection(new THREE.Vector3());
  hud.position.copy(cam.position).add(dir.multiplyScalar(60)).add(new THREE.Vector3(0, -17, 0).applyQuaternion(cam.quaternion)).add(new THREE.Vector3(-14, 0, 0).applyQuaternion(cam.quaternion));
  hud.scale.set(4.2 * L1.a, 4.2, 1); hud.material.opacity = Math.min(1, Math.max(0, (t - 0.6) / 0.5));
  R.render(S, cam);
}
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const t0 = performance.now();
function loop() { if (!rec) T = ((performance.now() - t0) / 1000) % 9; draw(T); requestAnimationFrame(loop); }
draw(0); window.__ready = true; requestAnimationFrame(loop);
</script>
</body>
</html>
