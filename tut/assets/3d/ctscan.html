<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><title>CT</title>
<style>@font-face{font-family:"L";src:url("fonts/label.ttf")}html,body{margin:0;height:100%;overflow:hidden;background:#02060a}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module">
// A symbolic scan, not the mummy: a simplified skeleton drawn in cyan lines on a scanner bed, a scan ring
// sweeps head to foot; the skull fragment glints (1968 X-ray), then the left femur turns red
// (2005 CT: fracture) and the left foot (2010: bone disease).  10 s.
import * as THREE from 'three';
import { setup, labeller, showLabel, pinNote, run, ramp, ease, lerp } from './common.js';
const { R, S, cam } = setup(0x02060a);
const label = await labeller(S);
const cyan = new THREE.MeshBasicMaterial({ color: 0x5fe0ff, transparent: true, opacity: 0.55, wireframe: true });
const cyanSolid = new THREE.MeshBasicMaterial({ color: 0x2aa8d8, transparent: true, opacity: 0.18 });
const red = new THREE.MeshBasicMaterial({ color: 0xff3b2e, transparent: true, opacity: 0.9 });
const sk = new THREE.Group(); S.add(sk);
function bone(len, r, x, y, z, rz = 0, rx = 0, mat = null) {
  const g = new THREE.Group();
  const m1 = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 10), mat || cyan); g.add(m1);
  const m2 = new THREE.Mesh(new THREE.CapsuleGeometry(r * 0.96, len, 4, 10), cyanSolid); g.add(m2);
  g.position.set(x, y, z); g.rotation.set(rx, 0, rz); sk.add(g); return g;
}
// lying along x (head at x = 0.9), facing up (+y)
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.11, 18, 14), cyan); skull.scale.set(1.2, 0.95, 0.9); skull.position.set(0.9, 0.1, 0); sk.add(skull);
const skull2 = new THREE.Mesh(new THREE.SphereGeometry(0.105, 18, 14), cyanSolid); skull2.scale.copy(skull.scale); skull2.position.copy(skull.position); sk.add(skull2);
const frag = new THREE.Mesh(new THREE.OctahedronGeometry(0.018), new THREE.MeshBasicMaterial({ color: 0xffffff })); frag.position.set(0.88, 0.07, 0.02); sk.add(frag);
bone(0.08, 0.025, 0.74, 0.08, 0, Math.PI / 2);                     // neck
bone(0.42, 0.03, 0.48, 0.08, 0, Math.PI / 2);                      // spine
for (let i = 0; i < 6; i++) { const rr = new THREE.Mesh(new THREE.TorusGeometry(0.11 - i * 0.004, 0.006, 6, 24, Math.PI * 1.3), cyan); rr.rotation.set(0, Math.PI / 2, Math.PI * 0.85); rr.position.set(0.62 - i * 0.04, 0.1, 0); sk.add(rr); }
bone(0.12, 0.05, 0.24, 0.08, 0, Math.PI / 2);                      // pelvis
for (const sz of [-1, 1]) {
  bone(0.26, 0.022, 0.5, 0.08, sz * 0.17, Math.PI / 2);             // upper arm
  bone(0.24, 0.018, 0.28, 0.1, sz * 0.12, Math.PI / 2 - 0.4);        // forearm, crossed
}
const femurR = bone(0.38, 0.028, 0.0, 0.08, 0.07, Math.PI / 2);
const femurL = bone(0.38, 0.028, 0.0, 0.08, -0.07, Math.PI / 2);
bone(0.36, 0.022, -0.42, 0.08, 0.07, Math.PI / 2); bone(0.36, 0.022, -0.42, 0.08, -0.07, Math.PI / 2);
const footR = bone(0.08, 0.03, -0.66, 0.11, 0.07, 0.3);
const footL = bone(0.08, 0.03, -0.66, 0.11, -0.07, 0.3);
// scanner bed and ring
const bed = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.04, 0.6), new THREE.MeshBasicMaterial({ color: 0x0c2230 })); bed.position.y = -0.0; S.add(bed);
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.04, 16, 64), new THREE.MeshBasicMaterial({ color: 0x8fe8ff, transparent: true, opacity: 0.8 })); ring.rotation.y = Math.PI / 2; S.add(ring);
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x6fe6ff, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })); sheet.rotation.y = Math.PI / 2; S.add(sheet);
// grid backdrop
const grid = new THREE.GridHelper(6, 30, 0x1b4a60, 0x0e2a38); grid.position.y = -0.02; S.add(grid);
const L = { frag: label('हड्डी का टुकड़ा', '1968 · एक्स-रे'), femur: label('बायाँ पैर: फ़्रैक्चर', '2005 · सीटी स्कैन', true), foot: label('पैर की हड्डी की बीमारी', '2010 · डीएनए/सीटी'), note: label('प्रतीकात्मक 3D मॉडल') };
L.frag.position.set(0.95, 0.42, 0.05); L.femur.position.set(0.0, 0.36, -0.2); L.foot.position.set(-0.7, 0.36, -0.2);
function draw(t) {
  const sx = lerp(1.15, -0.85, ease(ramp(t, 0.4, 6.0)));
  ring.position.set(sx, 0.1, 0); sheet.position.copy(ring.position); ring.visible = sheet.visible = t < 6.6;
  const fragOn = ramp(t, 1.0, 0.3); frag.scale.setScalar(0.5 + fragOn * (1.2 + 0.3 * Math.sin(t * 8)));
  const fem = ramp(t, 3.6, 0.4);
  for (const m of femurL.children) if (m.material === cyan) m.material = red;
  femurL.children[0].material.opacity = 0.55 + 0.35 * fem; femurL.children[0].visible = true;
  femurL.children[0].material = fem > 0 ? red : cyan;
  footL.children[0].material = ramp(t, 5.4, 0.3) > 0 ? red : cyan;
  // camera: start at the skull, glide along the body, end on a three-quarter view of the whole
  const a = ease(ramp(t, 0, 7.5));
  cam.position.set(lerp(1.4, 0.3, a), lerp(0.55, 1.25, a), lerp(-0.9, -1.75, a));
  cam.lookAt(lerp(0.85, 0.05, a), 0.08, 0);
  cam.fov = 36; cam.updateProjectionMatrix();
  showLabel(L.frag, cam, t, 1.2, 0.05); showLabel(L.femur, cam, t, 3.8, 0.05); showLabel(L.foot, cam, t, 5.6, 0.05);
  pinNote(L.note, cam, t, 0.3);
  R.render(S, cam);
}
run(draw, 10);
</script></body></html>
