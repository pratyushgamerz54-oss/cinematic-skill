<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><title>Coffins</title>
<style>@font-face{font-family:"L";src:url("fonts/label.ttf")}html,body{margin:0;height:100%;overflow:hidden;background:#050506}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module">
// Illustrative exploded view of the three nested coffins of Tutankhamun (shapes simplified).
// 0-2 s: the closed outer coffin turns under a spotlight.  2-7 s: the coffins slide apart, outer
// to the back, innermost to the front.  6-10 s: labels, the innermost glows: about 110 kg of gold.
import * as THREE from 'three';
import { setup, goldEnv, labeller, showLabel, pinNote, run, ramp, ease, lerp } from './common.js';
const { R, S, cam } = setup(0x050506);
const env = goldEnv(R); S.environment = env;
const label = await labeller(S);
// an anthropoid coffin: a lathe body (head to feet) flattened front to back, a face, crossed arms, a nemes collar
function coffin(len, goldTone, inlay) {
  // top-view outline of an anthropoid coffin (half-widths along the length, feet at 0, head at 1), extruded and bevelled
  const half = [[0, 0.10], [0.04, 0.115], [0.12, 0.09], [0.35, 0.12], [0.55, 0.15], [0.7, 0.195], [0.76, 0.19], [0.8, 0.135], [0.83, 0.2], [0.93, 0.18], [0.98, 0.12], [1.0, 0.0]];
  const sh = new THREE.Shape(); sh.moveTo(0, 0);
  for (const [y, w] of half) sh.lineTo(w * len, y * len);
  for (const [y, w] of [...half].reverse()) sh.lineTo(-w * len, y * len);
  const depth = len * 0.16, bev = len * 0.045;
  const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: len * 0.025, bevelSegments: 6, curveSegments: 4 });
  geo.translate(0, 0, -depth / 2);
  const g = new THREE.Group();
  const goldMat = new THREE.MeshStandardMaterial({ color: goldTone, metalness: 1, roughness: 0.25, envMapIntensity: 1.5 });
  const body = new THREE.Mesh(geo, goldMat); body.castShadow = true; g.add(body);
  const front = depth / 2 + bev;
  const bandM = new THREE.MeshStandardMaterial({ color: inlay, metalness: 0.3, roughness: 0.4 });
  // feather-pattern bands across the body, nemes stripes on the head
  for (let i = 0; i < 7; i++) { const yy = 0.18 + i * 0.07; const w = 0.1 + yy * 0.12;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w * 2 * len, len * 0.008, len * 0.004), bandM); b.position.set(0, yy * len, front + 0.002); g.add(b); }
  for (let i = 0; i < 5; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(len * 0.36, len * 0.007, len * 0.004), bandM); b.position.set(0, (0.845 + i * 0.022) * len, front + 0.002); g.add(b); }
  const face = new THREE.Mesh(new THREE.SphereGeometry(len * 0.06, 32, 24), new THREE.MeshStandardMaterial({ color: 0xe6b860, metalness: 1, roughness: 0.18 }));
  face.position.set(0, len * 0.885, front); face.scale.set(0.9, 1.15, 0.55); g.add(face);
  const beard = new THREE.Mesh(new THREE.CylinderGeometry(len * 0.01, len * 0.016, len * 0.06, 12), bandM); beard.position.set(0, len * 0.82, front + len * 0.01); g.add(beard);
  const arms = new THREE.Mesh(new THREE.TorusGeometry(len * 0.11, len * 0.014, 8, 32, Math.PI), bandM);
  arms.position.set(0, len * 0.66, front); arms.rotation.z = Math.PI; g.add(arms);
  for (const sx of [-1, 1]) { const st = new THREE.Mesh(new THREE.CylinderGeometry(len * 0.01, len * 0.01, len * 0.2, 8), bandM); st.position.set(sx * len * 0.04, len * 0.7, front + len * 0.01); st.rotation.z = sx * 0.55; g.add(st); }
  const wrap = new THREE.Group(); wrap.add(g); g.rotation.set(-Math.PI / 2, 0, 0); g.position.z = len / 2;   // lying on its back, head toward -z, centred
  return wrap;
}
const c1 = coffin(2.24, 0xb8862e, 0x1f3a6a), c2 = coffin(2.04, 0xc8963a, 0x7a2a3a), c3 = coffin(1.88, 0xf0c050, 0x2a4f8a);
for (const c of [c1, c2, c3]) S.add(c);
// floor and lights
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({ color: 0x0a0908, roughness: 0.8, metalness: 0.0 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.2; floor.receiveShadow = true; S.add(floor);
const spot = new THREE.SpotLight(0xffe2b0, 90, 30, 0.5, 0.7, 1.6); spot.position.set(1.5, 7, 3); spot.castShadow = true; S.add(spot); S.add(spot.target);
const rim = new THREE.DirectionalLight(0xff7040, 0.5); rim.position.set(-6, 2, -5); S.add(rim);
S.add(new THREE.HemisphereLight(0x6070a0, 0x100804, 0.5));
const glow = new THREE.PointLight(0xffc060, 0, 4, 2); S.add(glow);
const L = {
  c1: label('पहला ताबूत', 'लकड़ी, सोने की परत'), c2: label('दूसरा ताबूत', 'लकड़ी, सोने की परत'),
  c3: label('तीसरा ताबूत', 'ठोस सोना ≈ 110 किलो', true), note: label('प्रतीकात्मक 3D मॉडल')
};
function draw(t) {
  const k = ease(ramp(t, 2.0, 4.0));
  c1.position.set(lerp(0, -1.9, k), 0, lerp(0, 0.5, k));
  c2.position.set(0, lerp(0, 0.02, k), 0);
  c3.position.set(lerp(0, 1.9, k), lerp(0, 0.05, k), lerp(0, -0.5, k));
  c2.visible = k > 0.02; c3.visible = k > 0.04;   // nested inside until they slide out
  for (const c of [c1, c2, c3]) c.rotation.y = 0;
  // camera: close on the face of the closed coffin, then back to frame all three
  const a = ease(ramp(t, 0, 7));
  const ang = 0.25 - t * 0.035;
  cam.position.set(lerp(2.2, 3.2, a) + Math.sin(ang) * 0.6, lerp(1.4, 3.6, a), lerp(-1.9, -4.6, a));
  cam.lookAt(0, 0, lerp(-0.6, 0.1, a));
  glow.position.copy(c3.position).add(new THREE.Vector3(0, 0.8, 0)); glow.intensity = 6 * ramp(t, 7.0, 1.0);
  L.c1.position.copy(c1.position).add(new THREE.Vector3(0, 1.05, 0)); L.c2.position.copy(c2.position).add(new THREE.Vector3(0, 1.0, 0));
  L.c3.position.copy(c3.position).add(new THREE.Vector3(0, 0.95, 0));
  showLabel(L.c1, cam, t, 5.6, 0.04); showLabel(L.c2, cam, t, 6.2, 0.04); showLabel(L.c3, cam, t, 6.9, 0.045);
  pinNote(L.note, cam, t, 0.3);
  R.render(S, cam);
}
run(draw, 10);
</script></body></html>
